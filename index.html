<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conceito Barber Studio</title>
    <meta name="description"
        content="Landing page institucional para divulgação de serviços, portfólio e agendamentos de uma barbearia local.">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/header.css">
    <link rel="stylesheet" href="assets/css/hero.css">
</head>

<body>
    <header class="header">
        <div class="header-container">
            <!-- Botão Hamburguer (Mobile) -->
            <button class="mobile-menu-toggle" aria-label="Abrir menu">
                <span class="hamburger"></span>
            </button>

            <!-- Logo -->
            <a href="#" class="logo">
                <h2>CONCEITO <span>BARBER STUDIO</span></h2>
            </a>

            <!-- Navegação Desktop / Menu Mobile -->
            <nav class="nav-menu">
                <ul class="nav-list">
                    <li><a href="#inicio" class="nav-link active">Inicio</a></li>
                    <li><a href="#sobre" class="nav-link">Sobre</a></li>
                    <li><a href="#servicos" class="nav-link">Serviços</a></li>
                    <li><a href="#portfolio" class="nav-link">Portfolio</a></li>
                    <li><a href="#contato" class="nav-link">Contato</a></li>
                    <li><a href="#agendamento" class="nav-link btn-agendamento">Agendamento</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="inicio" class="hero">
        <div class="hero-bg">
            <img src="assets/img/hero-bg.png" alt="Interior de barbearia premium com iluminação cinematográfica">
        </div>
        <div class="hero-content">
            <p class="hero-subtitle">Conceito Barber Studio</p>
            <h1 class="hero-title">O CORTE DE QUALIDADE QUE VOCÊ MERECE, <span>COM QUEM VOCÊ CONFIA</span></h1>
            <p class="hero-description">Estilo, precisão e atitude. Agende seu horário e viva a experiência.</p>
            <a href="#agendamento" class="hero-cta">Agendar agora!</a>
        </div>
        <div class="hero-scroll-indicator">
            <span>Scroll</span>
            <div class="scroll-line"></div>
        </div>
    </section>

    <!-- Conteúdo principal -->

    <script src="js/main.js" type="module"></script>
</body>

</html>
